import org.apache.tools.ant.taskdefs.condition.Os

/*
 * Sjodur – root build
 *
 *   ./gradlew dev      backend (bootRun) + frontend (pnpm dev) side by side, Ctrl+C stops both
 *   ./gradlew check    backend tests + frontend lint and unit tests
 *   ./gradlew build    both production builds
 *   ./gradlew clean    removes backend/build and frontend/dist
 *
 * The backend is an included build (see settings.gradle); the frontend is driven through pnpm.
 */

plugins {
    id 'base'
}

def backend = gradle.includedBuild('backend')
def frontendDir = layout.projectDirectory.dir('frontend')
// pnpm as an absolute path: the daemon resolves commands with the PATH it was started with,
// which is not necessarily your shell's. Override with -Ppnpm.path=... or in ~/.gradle/gradle.properties.
def findOnPath = { String name ->
    def candidates = Os.isFamily(Os.FAMILY_WINDOWS) ? ["${name}.cmd", "${name}.exe", name] : [name]
    for (dir in (System.getenv('PATH') ?: '').split(File.pathSeparator)) {
        for (candidate in candidates) {
            def file = new File(dir, candidate)
            if (file.canExecute()) return file.absolutePath
        }
    }
    return null
}
def findPnpm = {
    def found = findOnPath('pnpm')
    if (found) return found
    def home = System.getProperty('user.home')
    def defaults = Os.isFamily(Os.FAMILY_WINDOWS)
            ? ["${System.getenv('LOCALAPPDATA')}/pnpm/pnpm.cmd"]
            : ["${System.getenv('PNPM_HOME') ?: ''}/pnpm", "$home/.local/share/pnpm/pnpm", "$home/Library/pnpm/pnpm"]
    return defaults.collect { new File(it) }.find { it.canExecute() }?.absolutePath
}
def pnpm = providers.gradleProperty('pnpm.path').getOrElse(findPnpm())
// ---------------------------------------------------------------------------
// Frontend
// ---------------------------------------------------------------------------

tasks.register('frontendInstall', Exec) {
    group = 'frontend'
    description = 'Installs frontend dependencies (pnpm install --frozen-lockfile).'
    workingDir frontendDir
    commandLine pnpm, 'install', '--frozen-lockfile'
    inputs.files(frontendDir.file('package.json'), frontendDir.file('pnpm-lock.yaml'))
    outputs.file(frontendDir.file('node_modules/.modules.yaml'))
    ignoreExitValue = true
    doLast {
        if (executionResult.get().exitValue != 0) {
            logger.error("\n==================================================================")
            logger.error(" frontendInstall FAILED – run './gradlew frontendInstall' to see why")
            logger.error("==================================================================\n")
            throw new GradleException('pnpm install failed (see output above)')
        }
    }
}
tasks.register('frontendDev', Exec) {
    group = 'frontend'
    description = 'Runs the Vike dev server on http://localhost:3000 (blocks until stopped).'
    dependsOn 'frontendInstall'
    workingDir frontendDir
    commandLine pnpm, 'dev'
    outputs.upToDateWhen { false }
}

tasks.register('frontendLint', Exec) {
    group = 'frontend'
    description = 'Runs ESLint.'
    dependsOn 'frontendInstall'
    workingDir frontendDir
    commandLine pnpm, 'lint'
}

tasks.register('frontendTest', Exec) {
    group = 'frontend'
    description = 'Runs Vitest unit and component tests.'
    dependsOn 'frontendInstall'
    workingDir frontendDir
    commandLine pnpm, 'test'
}

tasks.register('frontendBuild', Exec) {
    group = 'frontend'
    description = 'Creates the production build in frontend/dist.'
    dependsOn 'frontendInstall'
    workingDir frontendDir
    commandLine pnpm, 'build'
    inputs.files(fileTree(frontendDir) {
        exclude 'node_modules/**', 'dist/**', 'test-results/**', 'playwright-report/**'
    })
    outputs.dir(frontendDir.dir('dist'))
}

// ---------------------------------------------------------------------------
// Aggregates
// ---------------------------------------------------------------------------

tasks.register('dev') {
    group = 'sjodur'
    description = 'Starts backend and frontend together (needs org.gradle.parallel=true). Ctrl+C stops both.'
    dependsOn 'frontendDev', backend.task(':bootRun')
}

tasks.named('check') {
    dependsOn 'frontendLint', 'frontendTest', backend.task(':check')
}

tasks.named('build') {
    dependsOn 'frontendBuild', backend.task(':build')
}

tasks.named('clean') {
    dependsOn backend.task(':clean')
    delete frontendDir.dir('dist')
}


tasks.register('infraDown', Exec) {
    group = 'sjodur'
    description = 'Stops and removes the local infrastructure containers (data volumes stay).'
    commandLine 'docker', 'compose', '-f', 'infra/docker-compose.yml', 'down'
}