spring:
  docker:
    compose:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SJODUR_OIDC_ISSUER}
          # When the backend reaches Keycloak through an internal hostname while tokens carry the
          # public issuer URL, keep issuer-uri public and add the internal JWKS endpoint here, e.g.
          # jwk-set-uri: http://keycloak:8081/realms/sjodur/protocol/openid-connect/certs

# Structured logging: one ECS JSON object per line (same field names as the frontend server),
# ready for Elastic, Loki, Datadog or any JSON-aware log pipeline. Nothing to install –
# Spring Boot ships the encoder.
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: sjodur-backend
        version: ${SJODUR_VERSION:unknown}
        environment: ${SJODUR_ENVIRONMENT:production}
  level:
    root: INFO
    io.sjodur: INFO
    org.hibernate.SQL: WARN
