spring:
  docker:
    compose:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SJODUR_OIDC_ISSUER}
          # When the backend reaches Keycloak through an internal hostname while tokens carry the
          # public issuer URL, keep issuer-uri public and add the internal JWKS endpoint here, e.g.
          # jwk-set-uri: http://keycloak:8081/realms/sjodur/protocol/openid-connect/certs

# Logging (see logback-spring.xml): ECS JSON on stdout; files only with profile "file",
# error digests by mail only with profile "mail", e.g. SPRING_PROFILES_ACTIVE=prod,file,mail
logging:
  file:
    path: ${LOGGING_FILE_PATH:/var/log/sjodur}
  structured:
    ecs:
      service:
        name: sjodur-backend
        version: ${SJODUR_VERSION:unknown}
        environment: ${SJODUR_ENVIRONMENT:production}

sjodur:
  logging:
    mail:
      host: ${SJODUR_MAIL_HOST:localhost}
      port: ${SJODUR_MAIL_PORT:25}
      to: ${SJODUR_ALERT_MAIL:ops@localhost}
      from: ${SJODUR_MAIL_FROM:sjodur@localhost}
