# Sjodur – production reference installation on a single host (or a small cluster of hosts).
#
#   cp .env.example .env && edit           secrets, domains, image tags
#   ./scripts/render-realm.sh              Keycloak realm with your domain and client secret
#   docker compose up -d                   first start; Caddy fetches certificates automatically
#   docker compose up -d --scale frontend=2 --scale backend=2
#
# Only Caddy publishes ports. Everything else talks over the internal networks.
# The same images run unchanged on Kubernetes, Nomad or Swarm – see docs/deployment.md.

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ---------------------------------------------------------------- edge
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"          # HTTP/3
    environment:
      SJODUR_DOMAIN: ${SJODUR_DOMAIN}
      SJODUR_AUTH_DOMAIN: ${SJODUR_AUTH_DOMAIN}
      SJODUR_API_DOMAIN: ${SJODUR_API_DOMAIN:-api.${SJODUR_DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    logging: *logging

  # ---------------------------------------------------------------- app
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/OWNER/sjodur-frontend}:${SJODUR_VERSION:-latest}
    restart: unless-stopped
    deploy:
      replicas: ${FRONTEND_REPLICAS:-1}
    environment:
      NODE_ENV: production
      PORT: "3000"
      SJODUR_PUBLIC_URL: https://${SJODUR_DOMAIN}
      SJODUR_API_URL: http://backend:8080
      SJODUR_OIDC_ISSUER: https://${SJODUR_AUTH_DOMAIN}/realms/sjodur
      SJODUR_OIDC_CLIENT_ID: sjodur-web
      SJODUR_OIDC_CLIENT_SECRET: ${SJODUR_OIDC_CLIENT_SECRET}
      SJODUR_SESSION_SECRET: ${SJODUR_SESSION_SECRET}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [edge, internal]
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/OWNER/sjodur-backend}:${SJODUR_VERSION:-latest}
    restart: unless-stopped
    deploy:
      replicas: ${BACKEND_REPLICAS:-1}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SJODUR_DB_URL: jdbc:postgresql://postgres:5432/sjodur
      SJODUR_DB_USER: sjodur
      SJODUR_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Public issuer (must equal the "iss" claim) + internal JWKS endpoint (no round trip via the internet).
      SJODUR_OIDC_ISSUER: https://${SJODUR_AUTH_DOMAIN}/realms/sjodur
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/sjodur/protocol/openid-connect/certs
      SJODUR_VERSION: ${SJODUR_VERSION:-latest}
      SJODUR_ENVIRONMENT: ${SJODUR_ENVIRONMENT:-production}
      SJODUR_MAIL_HOST: ${SJODUR_MAIL_HOST:-}
      SJODUR_ALERT_MAIL: ${SJODUR_ALERT_MAIL:-}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+UseZGC"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [edge, internal]
    logging: *logging

  # ---------------------------------------------------------------- identity
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${SJODUR_AUTH_DOMAIN}
      KC_HTTP_ENABLED: "true"            # TLS terminates at Caddy
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/realm-sjodur.json:/opt/keycloak/data/import/realm-sjodur.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The Keycloak image ships neither curl nor wget; bash can speak HTTP to the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks: [edge, internal]
    logging: *logging

  # ---------------------------------------------------------------- state
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sjodur
      POSTGRES_USER: sjodur
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro   # creates the keycloak database on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sjodur -d sjodur"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]
    logging: *logging

  # ---------------------------------------------------------------- backups
  backup:
    image: postgres:17
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: sjodur
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - backups:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *logging

networks:
  edge:
  internal:
    internal: true          # no route to the internet: database, redis and backups stay inside

volumes:
  caddy-data:
  caddy-config:
  pgdata:
  redis-data:
  backups:
